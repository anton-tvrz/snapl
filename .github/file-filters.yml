# Path-based file filters for CI conditional job execution
# Used by dorny/paths-filter in GitHub Actions workflows

intent:
  - "packages/intent/**"
  - "tests/**"
  - "pyproject.toml"
  - "uv.lock"

executor:
  - "packages/executor/**"
  - "tests/**"
  - "pyproject.toml"
  - "uv.lock"

collector:
  - "packages/collector/**"
  - "tests/**"
  - "pyproject.toml"
  - "uv.lock"

observability:
  - "packages/observability/**"
  - "tests/**"
  - "pyproject.toml"
  - "uv.lock"

orchestrator:
  - "packages/orchestrator/**"
  - "tests/**"
  - "pyproject.toml"
  - "uv.lock"

presentation:
  - "packages/presentation/**"
  - "tests/**"
  - "pyproject.toml"
  - "uv.lock"

# Everything the unit suite exercises — not just .py files. Jinja templates
# are the executor's config output (snapshot-tested), and schema/seed YAML
# feeds the intent tests; changes to any of them must run the tests (#73).
python:
  - "**/*.py"
  - "**/*.j2"
  - "packages/*/*/templates/**"
  - "packages/intent/snapl_intent/schemas/**"
  - "packages/intent/snapl_intent/seed/**"
  - "pyproject.toml"
  - "uv.lock"

documentation:
  - "docs/**"
  - "dev/**"
  - "*.md"

ci:
  - ".github/**"
  - ".pre-commit-config.yaml"

infrastructure:
  - "development/**"
  - "docker-compose*.yml"

yaml:
  - "**/*.yml"
  - "**/*.yaml"
  - ".yamllint.yml"

schemas:
  - "packages/intent/snapl_intent/schemas/**"

templates:
  - "packages/*/templates/**"
  - "**/*.j2"
