[project]
name = "snapl-executor"
version = "0.1.0"
description = "NAF Executor building block — config deployment via gNMI, Jinja2 templates"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "snapl-intent",
    "jinja2>=3.1",
    "pygnmi>=0.8",
    "grpcio>=1.60",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snapl_executor"]
