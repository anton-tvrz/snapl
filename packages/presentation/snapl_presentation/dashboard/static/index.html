<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snapl dashboard</title>
<!--
  The spec 010 MVP page. It proves the API's data and nothing more: spec 011
  replaces it, and the API does not change. One file, no framework, no build
  step, and no request to any other origin (FR-008). Every value is rendered
  with textContent, because audit payloads hold device-supplied strings.
-->
<style>
  :root { color-scheme: light dark; --muted: #6b7280; --bad: #b91c1c; --warn: #b45309; --ok: #15803d; }
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 72rem; padding: 1rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .meta { color: var(--muted); margin-bottom: 1rem; }
  .problem { border-left: 4px solid var(--bad); padding: .5rem .75rem; margin: .5rem 0 1rem; }
  .problem.stale { border-color: var(--warn); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid rgba(127,127,127,.25); vertical-align: top; }
  th { font-weight: 600; }
  code { font: 12px/1.4 ui-monospace, monospace; user-select: all; }
  .state-in_sync { color: var(--ok); }
  .state-missing, .state-missing_and_undesired, .state-drifted, .state-error { color: var(--bad); }
  .state-undesired { color: var(--warn); }
  .state-never_scanned { color: var(--muted); }
  .paths { color: var(--muted); font-size: 12px; }
  @media (max-width: 40rem) { .wide { display: none; } }
</style>
</head>
<body>
<h1>snapl dashboard</h1>
<div class="meta" id="meta">Loading…</div>
<section>
  <h2>Devices</h2>
  <div id="devices-problem" hidden></div>
  <div class="meta" id="devices-age"></div>
  <table>
    <thead>
      <tr>
        <th>Device</th><th>Role</th><th>State</th><th class="wide">Last scan</th>
        <th class="wide">Last deploy</th><th>Next step</th>
      </tr>
    </thead>
    <tbody id="devices"></tbody>
  </table>
</section>
<section>
  <h2>Schedule</h2>
  <div id="schedule-problem" hidden></div>
  <div id="schedule"></div>
  <div id="failures"></div>
  <div class="meta" id="worker"></div>
</section>
<section>
  <h2>Running now</h2>
  <div id="running-problem" hidden></div>
  <ul id="running"></ul>
</section>
<section>
  <h2>Last 24 hours</h2>
  <div class="meta" id="history-meta"></div>
  <table>
    <thead>
      <tr>
        <th>Hour (UTC)</th><th>Scans</th><th>Most drifted devices</th><th class="wide">Most undesired paths</th>
        <th>Deploys ok / failed</th><th class="wide">Repairs ok / failed</th>
      </tr>
    </thead>
    <tbody id="history"></tbody>
  </table>
  <ul id="markers"></ul>
</section>
<section>
  <h2>Recent runs</h2>
  <div id="runs-problem" hidden></div>
  <table>
    <thead>
      <tr>
        <th>Started</th><th>Workflow</th><th>Target</th><th>State</th>
        <th class="wide">Trigger</th><th class="wide">Took</th>
      </tr>
    </thead>
    <tbody id="runs"></tbody>
  </table>
</section>
<script>
"use strict";

const REFRESH_MS = 5000;

function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (className) node.className = className;
  return node;
}

function age(iso) {
  if (!iso) return "never";
  const seconds = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  if (seconds < 60) return seconds + " s ago";
  if (seconds < 3600) return Math.round(seconds / 60) + " min ago";
  if (seconds < 86400) return Math.round(seconds / 3600) + " h ago";
  return Math.round(seconds / 86400) + " d ago";
}

// A view that is down, or stale, says why and what to run.
function showProblem(box, view) {
  box.replaceChildren();
  if (view.available) { box.hidden = true; return; }
  box.hidden = false;
  box.className = view.stale ? "problem stale" : "problem";
  const what = view.stale ? "Showing data from " + age(view.fetched_at) + ". " : "";
  box.append(el("div", what + view.source + " unavailable: " + view.reason));
  if (view.remedy) {
    const fix = el("div", "Try: ");
    fix.append(el("code", view.remedy));
    box.append(fix);
  }
}

function deviceRow(device) {
  const row = document.createElement("tr");
  row.append(el("td", device.name + (device.in_intent ? "" : " (not in intent)")));
  row.append(el("td", device.role || "unknown"));

  const state = el("td", device.drift_state.replaceAll("_", " "), "state-" + device.drift_state);
  const paths = [].concat(device.missing_paths, device.undesired_paths, device.unclassified_paths);
  for (const path of paths) state.append(el("div", path, "paths"));
  if (device.error) state.append(el("div", device.error, "paths"));
  row.append(state);

  row.append(el("td", age(device.last_scanned_at), "wide"));
  const deploy = device.last_deploy;
  row.append(el("td", deploy ? (deploy.success ? "succeeded " : "failed ") + age(deploy.ended_at) : "none", "wide"));

  const next = el("td");
  if (device.suggested_command) next.append(el("code", device.suggested_command));
  if (device.note) next.append(el("div", device.note, "paths"));
  row.append(next);
  return row;
}

function seconds(total) {
  if (total === null || total === undefined) return "";
  if (total < 120) return total + " s";
  return Math.round(total / 60) + " min";
}

// A link into the Temporal Web UI. The address comes from the API, so the
// page's own source names no other origin.
function runLink(run) {
  const link = el("a", run.workflow_type);
  link.href = run.web_ui_url;
  link.rel = "noopener noreferrer";
  link.target = "_blank";
  link.title = run.workflow_id;
  return link;
}

function runRow(run) {
  const row = document.createElement("tr");
  row.append(el("td", age(run.started_at)));
  const name = el("td");
  name.append(runLink(run));
  row.append(name);
  row.append(el("td", run.target || ""));
  const state = el("td", run.state);
  if (run.reason) state.append(el("div", run.reason, "paths"));
  row.append(state);
  row.append(el("td", run.trigger + (run.actor ? " (" + run.actor + ")" : ""), "wide"));
  row.append(el("td", seconds(run.duration_s), "wide"));
  return row;
}

function runningItem(run) {
  const item = el("li");
  item.append(runLink(run));
  item.append(el("span", " " + (run.target || "") + " · " + seconds(run.duration_s) + " so far · " + run.trigger));
  return item;
}

function renderSchedule(view, worker) {
  showProblem(document.getElementById("schedule-problem"), view);
  const box = document.getElementById("schedule");
  box.replaceChildren();
  const status = view.data;
  // Only a current answer from Temporal can say whether a schedule exists.
  if (status && view.available) {
    if (!status.exists) {
      box.append(el("div", "No drift schedule. Create one with:"));
      box.append(el("code", status.suggested_command));
    } else {
      const s = status.schedule;
      box.append(el("div", "Mode " + s.mode + " · every " + seconds(s.interval) +
        (s.paused ? " · paused" : " · active")));
      if (s.paused) {
        const who = status.paused_by ? " by " + status.paused_by + " " + age(status.paused_at) : "";
        box.append(el("div", "Paused" + who + (s.note ? ": " + s.note : ""), "paths"));
      }
      if (s.next_runs.length) box.append(el("div", "Next run " + s.next_runs[0], "paths"));
      const last = s.recent_runs[s.recent_runs.length - 1];
      if (last) box.append(el("div", "Last run " + age(last.started_at) + ": " + last.status, "paths"));
    }
  }
  const failures = document.getElementById("failures");
  failures.replaceChildren();
  for (const failure of (status && status.repeated_failures) || []) {
    const warning = el("div", failure.name + ": " + failure.consecutive_failures +
      " scheduled repairs failed in a row. Stop repairing with ", "problem");
    warning.append(el("code", failure.suggested_command));
    failures.append(warning);
  }
  const workerLine = document.getElementById("worker");
  if (worker.data) {
    workerLine.textContent = worker.data.pollers + " worker(s) polling " + worker.data.task_queue;
  } else {
    workerLine.textContent = "Worker state unknown";
  }
}

async function getJson(path) {
  const response = await fetch(path, { cache: "no-store" });
  if (!response.ok) throw new Error(path + ": HTTP " + response.status);
  return response.json();
}

function renderDevices(body) {
  const view = body.devices;
  document.getElementById("meta").textContent = "Use case " + body.use_case + " · read-only · refreshed every 5 s";
  showProblem(document.getElementById("devices-problem"), view);
  document.getElementById("devices-age").textContent = "Data read " + age(view.fetched_at);
  document.getElementById("devices").replaceChildren(...(view.data || []).map(deviceRow));
}

function renderRuns(body) {
  showProblem(document.getElementById("running-problem"), body.running);
  document.getElementById("running").replaceChildren(...(body.running.data || []).map(runningItem));
  showProblem(document.getElementById("runs-problem"), body.runs);
  document.getElementById("runs").replaceChildren(...(body.runs.data || []).map(runRow));
}

// Each panel is fetched and rendered on its own, so one failing route never
// blanks the others.
const PANELS = [
  ["/api/v1/devices", renderDevices],
  ["/api/v1/runs", renderRuns],
  ["/api/v1/schedule", (body) => renderSchedule(body.schedule, body.worker)],
];

const HISTORY_MS = 60000;

function counts(byOutcome) {
  if (!byOutcome || byOutcome.succeeded === null) return "";
  return byOutcome.succeeded + " / " + byOutcome.failed;
}

// One row per hour. Per-scan series are folded into their hour (the most
// drifted any scan saw); an hour with no scan and no deploy says so rather
// than showing zeros.
function renderHistory(body) {
  const byName = {};
  for (const series of body.series) byName[series.name] = series;
  const hours = byName.deploys.points;
  const scans = byName.drifted_devices.points;
  const undesired = byName.undesired_paths.points;
  const repairs = byName.repairs.points;
  const rows = [];
  hours.forEach((hour, index) => {
    const from = Date.parse(hour.t);
    const to = from + 3600 * 1000;
    const inHour = (point) => Date.parse(point.t) >= from && Date.parse(point.t) < to;
    const hourScans = scans.filter(inHour);
    const hourUndesired = undesired.filter(inHour).map((point) => point.value);
    const row = document.createElement("tr");
    row.append(el("td", hour.t.slice(0, 13).replace("T", " ") + ":00"));
    if (!hourScans.length && hour.by_outcome.succeeded === null) {
      const gap = el("td", "no scans", "state-never_scanned");
      gap.colSpan = 5;
      row.append(gap);
    } else {
      row.append(el("td", hourScans.length));
      row.append(el("td", hourScans.length ? Math.max(...hourScans.map((point) => point.value)) : ""));
      const known = hourUndesired.filter((value) => value !== null);
      row.append(el("td", known.length ? Math.max(...known) : (hourUndesired.length ? "unknown" : ""), "wide"));
      row.append(el("td", counts(hour.by_outcome)));
      row.append(el("td", counts(repairs[index] && repairs[index].by_outcome), "wide"));
    }
    rows.push(row);
  });
  document.getElementById("history").replaceChildren(...rows.reverse());
  const first = byName.deploys.first_event_at;
  document.getElementById("history-meta").textContent =
    first ? "The audit trail starts " + age(first) + "." : "The audit trail is empty.";
  const markers = byName.deploys.markers.map((marker) =>
    el("li", age(marker.t) + ": " + marker.kind + " " + marker.workflow_id + " (" + marker.trigger + ")"));
  document.getElementById("markers").replaceChildren(...markers);
}

async function refreshHistory() {
  try {
    renderHistory(await getJson("/api/v1/history"));
  } catch (error) {
    document.getElementById("history-meta").textContent = "History unavailable: " + error.message;
  }
}

async function refresh() {
  const results = await Promise.allSettled(PANELS.map(([path, render]) => getJson(path).then(render)));
  const failed = results.filter((result) => result.status === "rejected");
  if (failed.length === PANELS.length) {
    document.getElementById("meta").textContent =
      "The dashboard server did not answer (" + failed[0].reason.message + "). Is snapl dashboard running?";
  } else if (failed.length) {
    console.warn("dashboard panels failed:", failed.map((result) => result.reason.message));
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
refreshHistory();
setInterval(refreshHistory, HISTORY_MS);
</script>
</body>
</html>
