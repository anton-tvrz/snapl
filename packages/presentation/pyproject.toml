[project]
name = "snapl-presentation"
version = "0.1.0"
description = "NAF Presentation building block — CLI / API interface"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "snapl-orchestrator",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snapl_presentation"]
