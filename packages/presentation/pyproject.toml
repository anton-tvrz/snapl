[project]
name = "snapl-presentation"
version = "0.1.0"
description = "NAF Presentation building block — CLI / API interface"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "snapl-orchestrator",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.5",
    # Dashboard server (spec 010, ADR-0005). httpx is also the CI client.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
]

[project.scripts]
snapl = "snapl_presentation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snapl_presentation"]
# The designed UI's built files (spec 011). They are git-ignored, and hatchling
# leaves ignored files out unless they are listed here. Build them first with
# `uv run invoke dashboard.build`; without them the wheel serves the plain page.
artifacts = ["snapl_presentation/dashboard/static/ui/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["snapl_presentation/dashboard/static/ui/**"]
# The UI's source and toolchain are not needed to install or run the package.
exclude = ["ui"]
