[project]
name = "snapl-observability"
version = "0.1.0"
description = "NAF Observability building block — drift detection, metrics, audit"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "snapl-intent",
    "snapl-collector",
    "pydantic>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snapl_observability"]
