[project]
name = "snapl-orchestrator"
version = "0.1.0"
description = "NAF Orchestrator building block — Temporal workflows + activities"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "snapl-intent",
    "snapl-executor",
    "snapl-collector",
    "snapl-observability",
    "temporalio>=1.7",
    "pydantic>=2.5",
    "aiosqlite>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snapl_orchestrator"]
