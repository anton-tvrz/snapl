[project]
name = "snapl-intent"
version = "0.1.0"
description = "NAF Intent building block — Source of Truth, desired state models, schemas"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "infrahub-sdk[ctl]>=1.0.0",
    "pydantic>=2.5",
    "httpx>=0.25",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snapl_intent"]
