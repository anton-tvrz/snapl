[project]
name = "snapl-collector"
version = "0.1.0"
description = "NAF Collector building block — live network data retrieval"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "snapl-intent",
    "pygnmi>=0.8",
    "grpcio>=1.60",
    "pydantic>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snapl_collector"]
