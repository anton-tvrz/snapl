# snapl development stack — Infrahub Source of Truth + dependencies
#
# Adapted from OpsMill's stable docker-compose set:
#   - development/docker-compose.yml          (server + task-worker)
#   - development/docker-compose-deps.yml     (cache + message-queue + task-manager + task-manager-db)
#   - development/docker-compose-database-neo4j.yml
#
# Usage:
#   uv run invoke dev.deps        # up -d --wait
#   uv run invoke dev.stop        # stop containers
#   uv run invoke dev.down        # remove containers (--volumes to also delete data)
#   (or directly: docker compose -f development/docker-compose.yml up -d)
#
# Ports — snapl owns the 18000-18099 block (Issue #107). It deliberately binds
# NO conventional default: 8000, 7233, 7474, 7687, 6379, 5672, 15672, 4200 and
# 8233 are all claimed by sibling projects on a shared developer machine, and
# aiming at one of those reached another project's Infrahub and tried to load
# snapl's schema into it. A `+1` offset is not a fix either — 8001 belongs to
# synapse-gcp-base. See dev/knowledge/host-resource-registry.md; add new
# services to that table in the same commit.
#
#   Infrahub:     http://localhost:${INFRAHUB_PORT:-18000}
#   Neo4j:        bolt://localhost:${NEO4J_BOLT_PORT:-18087} (browser :${NEO4J_HTTP_PORT:-18074})
#   Redis:        localhost:${REDIS_PORT:-18079}
#   RabbitMQ:     localhost:${RABBITMQ_PORT:-18072} (mgmt :${RABBITMQ_MGMT_PORT:-18015})
#   Prefect:      localhost:${PREFECT_PORT:-18042}
#   Temporal:     localhost:${TEMPORAL_PORT:-18033} (Web UI http://localhost:${TEMPORAL_UI_PORT:-18034})
#
# Default admin login: admin / infrahub
# Default API token:   1ad8b66d-cca3-4523-821c-52c3d7e69100
#
# The token is snapl's alone (#115). It previously matched a sibling project's
# default, so a snapl task aimed at the wrong Infrahub authenticated as admin
# instead of being refused — the credential is the last line of defence when
# INFRAHUB_ADDRESS points somewhere unintended. Changing it takes effect only
# on a fresh instance: INFRAHUB_INITIAL_ADMIN_TOKEN is read at first boot, so
# an existing stack needs `invoke demo.reset` before it applies.

name: snapl

x-infrahub-env: &infrahub_env
  INFRAHUB_DB_ADDRESS: database
  INFRAHUB_DB_USERNAME: neo4j
  INFRAHUB_DB_PASSWORD: admin
  INFRAHUB_DB_PORT: 7687
  INFRAHUB_DB_PROTOCOL: bolt
  INFRAHUB_DB_TYPE: neo4j
  INFRAHUB_BROKER_ADDRESS: message-queue
  INFRAHUB_BROKER_USERNAME: infrahub
  INFRAHUB_BROKER_PASSWORD: infrahub
  INFRAHUB_CACHE_ADDRESS: cache
  INFRAHUB_WORKFLOW_ADDRESS: task-manager
  INFRAHUB_WORKFLOW_PORT: 4200
  INFRAHUB_PRODUCTION: "false"
  INFRAHUB_INITIAL_ADMIN_TOKEN: 1ad8b66d-cca3-4523-821c-52c3d7e69100
  INFRAHUB_INITIAL_ADMIN_PASSWORD: infrahub
  INFRAHUB_SECURITY_SECRET_KEY: 327f747f-efac-42be-9e73-999f08f86b92
  INFRAHUB_STORAGE_DRIVER: local
  INFRAHUB_ALLOW_ANONYMOUS_ACCESS: "true"
  PREFECT_API_URL: http://task-manager:4200/api

services:
  # ---------------------------------------------------------------------------
  # Neo4j — graph database backing Infrahub
  # ---------------------------------------------------------------------------
  database:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/admin
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_auth__minimum__password__length: "4"
    ports:
      - "${NEO4J_BOLT_PORT:-18087}:7687"
      - "${NEO4J_HTTP_PORT:-18074}:7474"
    volumes:
      - database_data:/data
      - database_logs:/logs
    healthcheck:
      test: wget -qO /dev/null http://localhost:7474 || exit 1
      interval: 2s
      timeout: 10s
      retries: 40
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Redis — cache
  # ---------------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-18079}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # RabbitMQ — message queue
  # ---------------------------------------------------------------------------
  message-queue:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: infrahub
      RABBITMQ_DEFAULT_PASS: infrahub
    ports:
      - "${RABBITMQ_PORT:-18072}:5672"
      - "${RABBITMQ_MGMT_PORT:-18015}:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Postgres — backing store for Prefect (task-manager)
  # ---------------------------------------------------------------------------
  task-manager-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prefect
    volumes:
      - task_manager_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d prefect -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Prefect — task orchestration (shipped inside the Infrahub image)
  # ---------------------------------------------------------------------------
  task-manager:
    image: registry.opsmill.io/opsmill/infrahub:stable
    command: uvicorn --host 0.0.0.0 --port 4200 --factory infrahub.prefect_server.app:create_infrahub_prefect
    environment:
      <<: *infrahub_env
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@task-manager-db:5432/prefect
      PREFECT_LOCAL_STORAGE_PATH: /opt/prefect/
    ports:
      - "${PREFECT_PORT:-18042}:4200"
    depends_on:
      task-manager-db:
        condition: service_healthy
    healthcheck:
      test: curl -sf http://localhost:4200/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Infrahub API / UI
  # ---------------------------------------------------------------------------
  server:
    image: registry.opsmill.io/opsmill/infrahub:stable
    command:
      - gunicorn
      - --config
      - backend/infrahub/serve/gunicorn_config.py
      - -w
      - "${WEB_CONCURRENCY:-2}"
      - --logger-class
      - infrahub.serve.log.GunicornLogger
      - infrahub.server:app
    environment:
      <<: *infrahub_env
      INFRAHUB_INTERNAL_ADDRESS: http://server:8000
    ports:
      - "${INFRAHUB_PORT:-18000}:8000"
    depends_on:
      database:
        condition: service_healthy
      message-queue:
        condition: service_healthy
      cache:
        condition: service_healthy
      task-manager:
        condition: service_healthy
    volumes:
      - storage_data:/opt/infrahub/storage
    tty: true
    healthcheck:
      test: curl -sf http://localhost:8000/api/config || exit 1
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Temporal — dev server for the snapl orchestrator (workflow engine + Web UI)
  #
  # Same semantics as running `temporal server start-dev` locally: default
  # namespace pre-created, Web UI included. Unlike the bare command, history
  # is persisted to SQLite on a named volume (#81) — `start-dev` defaults to
  # in-memory, which silently emptied the Web UI on every container restart
  # and took the demo's durability receipt with it. `demo.reset` still wipes
  # it, along with the rest of the stack's volumes.
  # ---------------------------------------------------------------------------
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db
    volumes:
      # Mounted on the image's own home directory, which exists and is owned by
      # the unprivileged `temporal` user (uid 1000) that the server runs as, so
      # Docker initialises the volume with that ownership. A volume mounted at a
      # path the image does not contain (/data) is created root-owned instead,
      # and the server dies with "unable to create SQLite admin DB".
      - temporal_data:/home/temporal
    ports:
      - "${TEMPORAL_PORT:-18033}:7233"
      - "${TEMPORAL_UI_PORT:-18034}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Prefect worker — runs git-sync, checks, generators, etc.
  # ---------------------------------------------------------------------------
  task-worker:
    image: registry.opsmill.io/opsmill/infrahub:stable
    command: prefect worker start --type infrahubasync --pool infrahub-worker --with-healthcheck
    restart: unless-stopped
    environment:
      <<: *infrahub_env
      INFRAHUB_ADDRESS: http://server:8000
      INFRAHUB_INTERNAL_ADDRESS: http://server:8000
      INFRAHUB_API_TOKEN: 1ad8b66d-cca3-4523-821c-52c3d7e69100
      INFRAHUB_TIMEOUT: "60"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - git_remote_data:/remote
    tty: true

volumes:
  database_data:
  database_logs:
  storage_data:
  task_manager_db:
  git_remote_data:
  temporal_data:
