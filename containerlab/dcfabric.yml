# snapl dcfabric lab — 2 spines x 4 leaves, Nokia SR Linux.
#
# Node names deliberately match the SoT seed data
# (packages/intent/snapl_intent/seed/dcfabric/topology.yml), so container
# hostnames come out as clab-dcfabric-spine-01 ... clab-dcfabric-leaf-04 —
# exactly the integration-test defaults (SRLINUX_HOST=clab-dcfabric-spine-01,
# gNMI on 57400).
#
# Deploy / destroy (see README.md in this directory):
#   uv run invoke dev.lab-deploy
#   uv run invoke dev.lab-destroy

name: dcfabric

# Dedicated management network (Issue #90). Without this block the lab would
# inherit containerlab's global default (`clab` / 172.20.20.0/24), which is
# shared with other labs on the same host — notably the
# project-network-synapse-quattro spine-leaf-lab. On a shared bridge docker
# hands out addresses dynamically and the two labs interleave, so one
# project's SoT address could resolve to the other's SR Linux nodes (same
# default credentials; this lab's gNMI is plaintext).
#
# A dedicated bridge + static pins gives each lab its own non-overlapping,
# deterministic address block, so an address belongs to exactly one lab.
# NOTE: on OrbStack all container bridges are mutually routable (verified),
# so this is address isolation, not L3 isolation — the guarantee is "no
# collision", not "no route". Subnet registry: quattro owns 172.20.20.0/24,
# snapl owns 172.20.21.0/24.
#
# The pins below are also the SoT's gNMI dial targets: they are seeded as each
# device's ``lab_node_name`` in packages/intent/snapl_intent/seed/dcfabric/
# topology.yml (Issue #96), because clab hostnames do not resolve from the
# host where the worker runs. The two files are ONE address registry —
# tests/unit/test_containerlab/test_topology.py fails if they drift apart.
# Change both together, and re-seed after changing them.
mgmt:
  network: clab-snapl
  ipv4-subnet: 172.20.21.0/24

topology:
  defaults:
    kind: nokia_srlinux
    # Strips TLS from the mgmt grpc-server: the snapl executor/collector
    # and the integration tests dial gNMI in plaintext (insecure=True).
    startup-config: srlinux-insecure-gnmi.partial.cfg

  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:latest

  nodes:
    # Spines: 7220 IXR-D3 (matches seed device_type)
    spine-01:
      type: ixr-d3
      mgmt-ipv4: 172.20.21.11
    spine-02:
      type: ixr-d3
      mgmt-ipv4: 172.20.21.12
    # Leaves: 7220 IXR-D2 (matches seed device_type)
    leaf-01:
      type: ixr-d2
      mgmt-ipv4: 172.20.21.13
    leaf-02:
      type: ixr-d2
      mgmt-ipv4: 172.20.21.14
    leaf-03:
      type: ixr-d2
      mgmt-ipv4: 172.20.21.15
    leaf-04:
      type: ixr-d2
      mgmt-ipv4: 172.20.21.16

  # Cabling plan mirrors the seed interface data: each spine has one link to
  # each leaf on ethernet-1/1..4; leaf uplinks are ethernet-1/49 (to spine-01)
  # and ethernet-1/50 (to spine-02).
  links:
    - endpoints: ["spine-01:e1-1", "leaf-01:e1-49"]
    - endpoints: ["spine-01:e1-2", "leaf-02:e1-49"]
    - endpoints: ["spine-01:e1-3", "leaf-03:e1-49"]
    - endpoints: ["spine-01:e1-4", "leaf-04:e1-49"]
    - endpoints: ["spine-02:e1-1", "leaf-01:e1-50"]
    - endpoints: ["spine-02:e1-2", "leaf-02:e1-50"]
    - endpoints: ["spine-02:e1-3", "leaf-03:e1-50"]
    - endpoints: ["spine-02:e1-4", "leaf-04:e1-50"]
