# Partial startup config applied on top of containerlab's generated SR Linux
# config. snapl's executor/collector (and the integration tests) dial gNMI in
# plaintext (pygnmi insecure=True) on 57400, but containerlab attaches its
# generated TLS profile (clab-profile) to the mgmt grpc-server. Strip TLS so
# port 57400 accepts insecure connections. Lab use only.
delete / system grpc-server mgmt tls-profile
set / system grpc-server mgmt default-tls-profile false
